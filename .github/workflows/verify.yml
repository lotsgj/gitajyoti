name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: dev-tools/pnpm-lock.yaml
      - name: Install development tools
        working-directory: dev-tools
        run: pnpm install --frozen-lockfile
      - name: Run client and OpenAPI checks
        working-directory: dev-tools
        run: pnpm run check
      - name: Run mock API tests
        run: python3 -m unittest discover -s mygita-server/tests
