name: Verify and deploy public site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: dev-tools/pnpm-lock.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: mygita-server/requirements.txt
      - name: Install server dependencies
        run: python3 -m pip install -r mygita-server/requirements.txt
      - name: Install development tools
        working-directory: dev-tools
        run: pnpm install --frozen-lockfile
      - name: Run client and OpenAPI checks
        working-directory: dev-tools
        run: pnpm run check
      - name: Run mock API tests
        run: python3 -m unittest discover -s mygita-server/tests

  build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    env:
      REGISTRATION_DEPLOY_MODE: live
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node dev-tools/scripts/build-public-site.mjs
      - run: node dev-tools/scripts/verify-public-site.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
