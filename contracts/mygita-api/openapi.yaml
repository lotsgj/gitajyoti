          items: {type: string}
        completedActivityIds:
          type: array
          uniqueItems: true
          items: {type: string}
        experience: {$ref: '#/components/schemas/ExperienceSummary'}
        nextActivity:
          anyOf:
            - $ref: '#/components/schemas/Activity'
            - {type: 'null'}
        progress: {$ref: '#/components/schemas/Progress'}
    JourneyCreate:
      type: object
      additionalProperties: false
      required: [experienceId]
      properties:
        experienceId: {type: string, pattern: '^exp-'}
        batchId:
          anyOf:
            - {type: string, pattern: '^batch-'}
            - {type: 'null'}
    Interest:
      type: object
      additionalProperties: false
      required: [id, userId, experienceId, registeredAt]
      properties:
        id: {type: string, pattern: '^interest-'}
        userId: {type: string, pattern: '^user-'}
        experienceId: {type: string, pattern: '^exp-'}
        registeredAt: {type: string, format: date-time}
    InterestCreate:
      type: object
      additionalProperties: false
      required: [experienceId]
      properties:
        experienceId: {type: string, pattern: '^exp-'}
    JourneyCollection:
      type: object
      additionalProperties: false
      required: [items, interests]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Journey'}
        interests:
          type: array
          items: {$ref: '#/components/schemas/Interest'}
    JourneyRecord:
      type: object
      additionalProperties: false
      description: >-
        A Journey's own stored fields, without the enriched `experience`,
        `nextActivity`, or `progress` that `Journey` adds for
        `GET /me/journey`, `createJourney`, and `completeMyActivity`.
      required: [id, userId, experienceId, batchId, status, startedOn, lastAccessed, currentContext, activityIds, completedActivityIds]
      properties:
        id: {type: string, pattern: '^journey-'}
        userId: {type: string, pattern: '^user-'}
        experienceId: {type: string, pattern: '^exp-'}
        batchId:
          anyOf:
            - {type: string, pattern: '^batch-'}
            - {type: 'null'}
        status: {type: string, enum: [active, completed]}
        startedOn: {type: string, format: date}
        lastAccessed: {type: string, format: date-time}
        currentContext: {type: string}
        activityIds:
          type: array
          items: {type: string}
        completedActivityIds:
          type: array
          uniqueItems: true
          items: {type: string}
    JourneyRecordList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/JourneyRecord'}
    InterestList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Interest'}
    ActivityState:
      type: object
      additionalProperties: false
      required: [journeyId, completedActivityIds]
      properties:
        journeyId: {type: string, pattern: '^journey-'}
        completedActivityIds:
          type: array
          uniqueItems: true
          items: {type: string}
    ActivityStateList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ActivityState'}
    ResetResult:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: {type: string, const: reset}
