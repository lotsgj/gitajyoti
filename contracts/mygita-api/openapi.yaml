openapi: 3.1.0
info:
  title: MyGita API
  version: 0.4.0
  description: >-
    Authoritative browser-to-server contract for the MyGita region. The current
    implementation is a local mock API. Password Account creation and login are
    implemented. Version 0.3 added contract-first data-use optimization operations.
    Version 0.4 adds the Journey-, interest-, and activity-state-projection
    operations (`/me/journeys`, `GET /me/interests`, `/me/activity-state`) that
    let a client refresh only the `/me/manifest` projection that changed,
    without refetching the other two.
  license:
    name: All rights reserved
    identifier: LicenseRef-Proprietary
servers:
  - url: http://127.0.0.1:8081/api/v1
    description: Local mock API
tags:
  - name: Service
    description: Service discovery and operational health.
  - name: Experiences
    description: Public learning-experience catalogue and batches.
  - name: Identity
    description: Authentication, learner identity, profile, and onboarding.
  - name: Journey
    description: Learner interests, enrolments, activities, and progress.
  - name: Development
    description: Local mock-server operations that are excluded from production.
security: []
paths:
  /:
    get:
      tags: [Service]
      operationId: getApiIndex
      summary: Describe the API
      responses:
        '200':
          description: API identity and links
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiIndex'
              example:
                service: My Gita mock API
                version: '1'
                status: ok
                links:
                  health: /api/v1/health
                  experiences: /api/v1/experiences
        default:
          $ref: '#/components/responses/UnexpectedError'
  /health:
    get:
      tags: [Service]
      operationId: getHealth
      summary: Check service health
      responses:
        '200':
          description: Healthy service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: ok
                service: mygita-mock-api
                version: '1'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /experiences:
    get:
      tags: [Experiences]
      operationId: listExperiences
      summary: List published experiences
      responses:
        '200':
          description: Published experience catalogue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperienceList'
              example:
                items: []
        default:
          $ref: '#/components/responses/UnexpectedError'
  /experience-catalogue/manifest:
    get:
      tags: [Experiences]
      operationId: getExperienceCatalogueManifest
      summary: Get public catalogue and Experience-detail versions
      description: >-
        Returns opaque versions used to decide whether locally cached catalogue
        summaries or individual Experience details are current. Clients compare
        versions for equality and must not parse, order, or increment them.
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Current catalogue manifest
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperienceCatalogueManifest'
              example:
                catalogueVersion: catalogue-8
                generatedAt: '2026-09-12T08:00:00Z'
                experiences:
                  - id: exp-gita-children
                    slug: gita-for-children
                    detailVersion: experience-gita-children-12
                  - id: exp-gita-sara
                    slug: gita-sara
                    detailVersion: experience-gita-sara-7
        '304':
          description: The client manifest version is still current
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /experience-catalogue/summaries:
    get:
      tags: [Experiences]
      operationId: listExperienceSummaries
      summary: List card-sized published Experience summaries
      description: Returns only the fields needed to render the Discover catalogue.
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Published Experience summaries
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperienceCatalogueSummary'
              example:
                catalogueVersion: catalogue-8
                items:
                  - id: exp-gita-children
                    slug: gita-for-children
                    title: Gita for Children
                    subtitle: From learning the Gita’s shlokas to living their wisdom
                    shortDescription: A learning journey for living the wisdom of selected shlokas.
                    image:
                      src: placeholders/gita-for-children
                      alt: Children learning the Gita together
                    designedFor: [Ages 7–18]
                    guidanceMode: blended
        '304':
          description: The client catalogue version is still current
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /experiences/{experienceId}:
    parameters:
      - $ref: '#/components/parameters/ExperienceId'
    get:
      tags: [Experiences]
      operationId: getExperience
      summary: Get a published experience by ID or slug
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Experience details
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Experience'
              examples:
                gitaSara:
                  $ref: '#/components/examples/GitaSaraExperience'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '304':
          description: The client Experience-detail version is still current
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /experiences/{experienceId}/batches:
    parameters:
      - $ref: '#/components/parameters/ExperienceId'
    get:
      tags: [Experiences]
      operationId: listExperienceBatches
      summary: List batches for a published experience
      responses:
        '200':
          description: Batches belonging to the experience
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchList'
              example:
                items:
                  - id: batch-sara-2026-09
                    experienceId: exp-gita-sara
                    name: Gita Sāra — September 2026 Evening
                    timezone: Asia/Kolkata
                    batchPeriod:
                      startsOn: '2026-09-19'
                      endsOn: '2027-03-27'
                    enrolment:
                      state: open
                      opensOn: '2026-08-15'
                      closesOn: '2026-09-18'
                      capacity: 40
                    status: scheduled
        '404':
          $ref: '#/components/responses/NotFoundError'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /auth/otp/request:
    post:
      tags: [Identity]
      operationId: requestOtp
      summary: Request a prototype OTP challenge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpRequest'
            example:
              countryCode: '+91'
              mobile: '9876543210'
      responses:
        '201':
          description: OTP challenge created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpChallenge'
              example:
                challengeId: otp-example-challenge
                expiresInSeconds: 300
                prototypeOtp: '123456'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '422':
          $ref: '#/components/responses/ValidationError'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /auth/otp/verify:
    post:
      tags: [Identity]
      operationId: verifyOtp
      summary: Verify a prototype OTP challenge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerification'
            example:
              challengeId: otp-example-challenge
              otp: '123456'
      responses:
        '200':
          description: Authenticated session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
              example:
                accessToken: eyJhbGciOiJIUzI1NiJ9.example.signature
                tokenType: Bearer
                expiresIn: 28800
                isNewUser: true
                user:
                  id: user-example
                  roles: [learner]
                  status: active
                  personalDetails:
                    fullName: ''
                    displayName: ''
                    email: ''
                    mobile: '+919876543210'
                    dateOfBirth: ''
                    preferredLanguage: ''
                    city: ''
                    country: India
                    timezone: Asia/Kolkata
                    profilePicture: ''
                  onboarding:
                    state: pending
                    completedAt: null
                  createdAt: '2026-09-10T10:00:00+00:00'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /auth/accounts:
    post:
      tags: [Identity]
      operationId: createPasswordAccount
      summary: Create an Account with a username and password
      description: >-
        Atomically creates a unique Account, password Authenticator, and pending
        Profile, then establishes an authenticated session. Mobile number and
        email address are not required and are not implicitly verified.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordAccountCreate'
            example:
              username: vijay
              password: a long memorable passphrase
      responses:
        '201':
          description: Account created and session established
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
              example:
                accessToken: eyJhbGciOiJIUzI1NiJ9.example.signature
                tokenType: Bearer
                expiresIn: 28800
                isNewUser: true
                user:
                  id: user-example
                  roles: [learner]
                  status: active
                  personalDetails:
                    fullName: ''
                    displayName: ''
                    email: ''
                    mobile: ''
                    dateOfBirth: ''
                    preferredLanguage: ''
                    city: ''
                    country: India
                    timezone: Asia/Kolkata
                    profilePicture: ''
                  onboarding:
                    state: pending
                    completedAt: null
                  createdAt: '2026-09-11T10:00:00+00:00'
        '409':
          description: The normalized username is already assigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: username_unavailable
                  message: Choose a different username
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /auth/password/login:
    post:
      tags: [Identity]
      operationId: loginWithPassword
      summary: Log in with a username and password
      description: >-
        Normalizes the username, verifies the password Authenticator, and
        establishes a session. Unknown usernames and incorrect passwords return
        the same error so the response does not disclose Account existence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordLogin'
            example:
              username: vijay
              password: a long memorable passphrase
      responses:
        '200':
          description: Authenticated session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
              example:
                accessToken: eyJhbGciOiJIUzI1NiJ9.example.signature
                tokenType: Bearer
                expiresIn: 28800
                isNewUser: false
                user:
                  id: user-example
                  roles: [learner]
                  status: active
                  personalDetails:
                    fullName: Vijay Sharma
                    displayName: Vijay
                    email: ''
                    mobile: ''
                    dateOfBirth: '1985-05-12'
                    preferredLanguage: English
                    city: Bengaluru
                    country: India
                    timezone: Asia/Kolkata
                    profilePicture: ''
                  onboarding:
                    state: complete
                    completedAt: '2026-09-11T10:01:00+00:00'
                  createdAt: '2026-09-11T10:00:00+00:00'
        '401':
          description: Username or password is incorrect
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: invalid_credentials
                  message: Username or password is incorrect
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /me:
    get:
      tags: [Identity]
      operationId: getCurrentUser
      summary: Get the authenticated learner
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current learner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              examples:
                activeLearner:
                  $ref: '#/components/examples/CompleteUser'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        default:
          $ref: '#/components/responses/UnexpectedError'
    patch:
      tags: [Identity]
      operationId: updateCurrentUser
      summary: Update editable learner profile fields
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdate'
            example:
              displayName: Vijay
              city: Bengaluru
              preferredLanguage: English
      responses:
        '200':
          description: Updated learner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              examples:
                activeLearner:
                  $ref: '#/components/examples/CompleteUser'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /me/onboarding:
    patch:
      tags: [Identity]
      operationId: completeOnboarding
      summary: Complete optional learner Profile setup
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardingUpdate'
            example:
              fullName: Vijay Sharma
              displayName: Vijay
              dateOfBirth: '1985-05-12'
      responses:
        '200':
          description: Onboarded learner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              examples:
                activeLearner:
                  $ref: '#/components/examples/CompleteUser'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '422':
          $ref: '#/components/responses/ValidationError'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /me/manifest:
    get:
      tags: [Identity, Journey]
      operationId: getMyGitaManifest
      summary: Get versions of the signed-in Account's MyGita projections
      description: >-
        Returns independent opaque versions so a client can refresh only the
        private Profile, Journey, interest, or activity-state projection that
        changed. This response contains no public catalogue versions.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Current private projection versions
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyGitaDataManifest'
              example:
                accountId: user-example
                accountVersion: account-4
                profileVersion: profile-9
                journeyVersion: journey-27
                interestVersion: interest-6
                activityStateVersion: activity-state-41
                generatedAt: '2026-09-12T08:00:00Z'
        '304':
          description: All private projection versions are still current
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '403':
          $ref: '#/components/responses/AuthorizationError'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /me/journey:
    get:
      tags: [Journey]
      operationId: getMyJourney
      summary: List the learner's journeys and interests
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Learner journey state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JourneyCollection'
              example:
                items: []
                interests: []
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '403':
          $ref: '#/components/responses/AuthorizationError'
        default:
          $ref: '#/components/responses/UnexpectedError'
    post:
      tags: [Journey]
      operationId: createJourney
      summary: Enrol the learner in an experience
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JourneyCreate'
            example:
              experienceId: exp-gita-sara
              batchId: batch-sara-2026-09
      responses:
        '201':
          description: Created and enriched journey
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Journey'
              examples:
                activeJourney:
                  $ref: '#/components/examples/ActiveJourney'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '403':
          $ref: '#/components/responses/AuthorizationError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/ValidationError'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /me/journeys:
    get:
      tags: [Journey]
      operationId: listMyJourneys
      summary: Get the learner's Journey records independently of interests and activity state
      description: >-
        Returns raw Journey records (no enriched `experience`, `nextActivity`,
        or `progress`) so a client can refresh Journeys without also
        refetching interests or activity state. The ETag corresponds to
        `journeyVersion` from `GET /me/manifest` and is weak: `journeyVersion`
        covers only each Journey's identity fields (id, userId, experienceId,
        batchId, status, activityIds), so `lastAccessed` and
        `completedActivityIds` in this body can still change (e.g. on
        activity completion) without it -- that is `activityStateVersion`'s
        role instead, via `GET /me/activity-state`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: The signed-in Account's Journey records
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JourneyRecordList'
              example:
                items:
                  - id: journey-example
                    userId: user-example
                    experienceId: exp-gita-sara
                    batchId: batch-sara-2026-09
                    status: active
                    startedOn: '2026-09-10'
                    lastAccessed: '2026-09-10T10:02:00Z'
                    currentContext: Foundations
                    activityIds: [activity-sara-teaching]
                    completedActivityIds: []
        '304':
          description: The client journeyVersion is still current
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '403':
          $ref: '#/components/responses/AuthorizationError'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /me/interests:
    get:
      tags: [Journey]
      operationId: listMyInterests
      summary: Get the learner's interest registrations independently of Journeys and activity state
      description: >-
        Returns interest registrations only, so a client can refresh interests
        without also refetching Journeys or activity state. The ETag
        corresponds to `interestVersion` from `GET /me/manifest`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: The signed-in Account's interest registrations
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterestList'
              example:
                items:
                  - id: interest-example
                    userId: user-example
                    experienceId: exp-purna-yoga
                    registeredAt: '2026-09-12T08:00:00Z'
        '304':
          description: The client interestVersion is still current
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '403':
          $ref: '#/components/responses/AuthorizationError'
        default:
          $ref: '#/components/responses/UnexpectedError'
    post:
      tags: [Journey]
      operationId: registerInterest
      summary: Register interest in an experience
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InterestCreate'
            example:
              experienceId: exp-purna-yoga
      responses:
        '201':
          description: Registered interest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Interest'
              example:
                id: interest-example
                userId: user-example
                experienceId: exp-purna-yoga
                registeredAt: '2026-09-10T10:00:00+00:00'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '403':
          $ref: '#/components/responses/AuthorizationError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/ValidationError'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /me/activity-state:
    get:
      tags: [Journey]
      operationId: listMyActivityState
      summary: Get the learner's activity-completion state independently of Journeys and interests
      description: >-
        Returns each Journey's completed-activity progress only, so a client
        can refresh activity state without also refetching Journeys or
        interests. The ETag corresponds to `activityStateVersion` from
        `GET /me/manifest`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: The signed-in Account's per-Journey activity completion state
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityStateList'
              example:
                items:
                  - journeyId: journey-example
                    completedActivityIds: [activity-sara-teaching]
        '304':
          description: The client activityStateVersion is still current
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '403':
          $ref: '#/components/responses/AuthorizationError'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /me/activities/{activityId}:
    parameters:
      - $ref: '#/components/parameters/ActivityId'
    get:
      tags: [Journey]
      operationId: getMyActivity
      summary: Get a learner activity and delivery session
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Activity in the learner's journey
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerActivity'
              examples:
                teaching:
                  $ref: '#/components/examples/LearnerActivity'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '403':
          $ref: '#/components/responses/AuthorizationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /me/activities/{activityId}/complete:
    parameters:
      - $ref: '#/components/parameters/ActivityId'
    post:
      tags: [Journey]
      operationId: completeMyActivity
      summary: Mark a learner activity complete
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
            example: {}
      responses:
        '200':
          description: Updated journey
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Journey'
              examples:
                activeJourney:
                  $ref: '#/components/examples/ActiveJourney'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '403':
          $ref: '#/components/responses/AuthorizationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /dev/reset:
    post:
      tags: [Development]
      operationId: resetDevelopmentState
      summary: Reset local mock runtime state
      description: Development-only operation. It must not exist in the production API.
      responses:
        '200':
          description: Runtime state reset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetResult'
              example:
                status: reset
        default:
          $ref: '#/components/responses/UnexpectedError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: >-
        ETag from an earlier representation. The value is opaque; clients
        return it unchanged and must not interpret it as an ordered version.
      schema:
        type: string
        minLength: 1
      example: '"catalogue-8"'
    ExperienceId:
      name: experienceId
      in: path
      required: true
      description: Stable experience ID or public slug.
      schema:
        type: string
        minLength: 1
      example: exp-gita-sara
    ActivityId:
      name: activityId
      in: path
      required: true
      description: Stable activity ID.
      schema:
        type: string
        minLength: 1
      example: activity-sara-teaching
  headers:
    ETag:
      description: Opaque validator for the returned representation.
      required: true
      schema:
        type: string
        minLength: 1
      example: '"catalogue-8"'
  responses:
    BadRequestError:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: invalid_otp_challenge
              message: OTP challenge is invalid
    AuthenticationError:
      description: Authentication failed or is required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: authentication_required
              message: A bearer token is required
    AuthorizationError:
      description: The learner is not authorized to perform the operation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: operation_not_permitted
              message: This Account cannot perform the requested operation
    NotFoundError:
      description: Requested resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: experience_not_found
              message: Experience not found
    ConflictError:
      description: Request conflicts with existing learner state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: duplicate_enrolment
              message: This Experience is already active in your Journey
    ValidationError:
      description: Request failed domain validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: missing_profile_fields
              message: Complete all mandatory profile details
              details:
                fields: [fullName, displayName, dateOfBirth]
    RateLimitError:
      description: Too many attempts
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: otp_attempts_exceeded
              message: Too many OTP attempts
    UnexpectedError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: internal_error
              message: The mock server encountered an unexpected error
  schemas:
    ApiIndex:
      type: object
      additionalProperties: false
      required: [service, version, status, links]
      properties:
        service: {type: string}
        version: {type: string}
        status: {type: string, const: ok}
        links:
          type: object
          additionalProperties: false
          required: [health, experiences]
          properties:
            health: {type: string}
            experiences: {type: string}
    Health:
      type: object
      additionalProperties: false
      required: [status, service, version]
      properties:
        status: {type: string, const: ok}
        service: {type: string}
        version: {type: string}
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: {type: string, minLength: 1}
            message: {type: string, minLength: 1}
            details:
              type: object
              additionalProperties: true
    OpaqueVersion:
      type: string
      minLength: 1
      maxLength: 128
      description: >-
        Equality-only version identifier. Consumers must not parse, sort,
        increment, or infer chronology from this value.
    Image:
      type: object
      additionalProperties: false
      required: [src, alt]
      properties:
        src: {type: string, minLength: 1}
        alt: {type: string, minLength: 1}
    Delivery:
      type: object
      additionalProperties: false
      required: [requiresBatch, supportsSelfStart]
      properties:
        requiresBatch: {type: boolean}
        supportsSelfStart: {type: boolean}
    Commitment:
      type: object
      additionalProperties: false
      required: [summary]
      properties:
        summary: {type: string, minLength: 1}
    ContentScope:
      type: object
      additionalProperties: false
      required: [scripture, chapters, shlokas, selection]
      properties:
        scripture: {type: string}
        chapters: {type: integer, minimum: 1}
        shlokas: {type: integer, minimum: 1}
        selection: {type: string}
    ProcessStep:
      type: object
      additionalProperties: false
      required: [order, title, description]
      properties:
        order: {type: integer, minimum: 1}
        title: {type: string, minLength: 1}
        description: {type: string, minLength: 1}
    Experience:
      type: object
      additionalProperties: false
      required:
        - id
        - slug
        - status
        - title
        - subtitle
        - shortDescription
        - description
        - image
        - designedFor
        - needs
        - form
        - guidanceMode
        - languages
        - commitment
        - recommendedProcess
        - intendedOutcomes
        - constituentActivityIds
        - delivery
        - initialContext
      properties:
        id: {type: string, pattern: '^exp-'}
        slug: {type: string, minLength: 1}
        status: {type: string, enum: [published]}
        title: {type: string, minLength: 1}
        subtitle: {type: string, minLength: 1}
        shortDescription: {type: string, minLength: 1}
        description: {type: string, minLength: 1}
        image: {$ref: '#/components/schemas/Image'}
        designedFor:
          type: array
          minItems: 1
          items: {type: string}
        needs:
          type: array
          minItems: 1
          items: {type: string}
        form: {type: string, minLength: 1}
        guidanceMode: {type: string, minLength: 1}
        languages:
          type: array
          minItems: 1
          items: {type: string}
        contentScope: {$ref: '#/components/schemas/ContentScope'}
        commitment: {$ref: '#/components/schemas/Commitment'}
        recommendedProcess:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/ProcessStep'}
        intendedOutcomes:
          type: array
          minItems: 1
          items: {type: string}
        constituentActivityIds:
          type: array
          minItems: 1
          items: {type: string, pattern: '^activity-'}
        delivery: {$ref: '#/components/schemas/Delivery'}
        initialContext: {type: string, minLength: 1}
    ExperienceSummary:
      type: object
      additionalProperties: false
      required: [id, slug, title, subtitle]
      properties:
        id: {type: string}
        slug: {type: string}
        title: {type: string}
        subtitle: {type: string}
    ExperienceCardSummary:
      type: object
      additionalProperties: false
      required: [id, slug, title, subtitle, shortDescription, image, designedFor, guidanceMode]
      properties:
        id: {type: string, pattern: '^exp-'}
        slug: {type: string, minLength: 1}
        title: {type: string, minLength: 1}
        subtitle: {type: string, minLength: 1}
        shortDescription: {type: string, minLength: 1}
        image: {$ref: '#/components/schemas/Image'}
        designedFor:
          type: array
          minItems: 1
          items: {type: string, minLength: 1}
        guidanceMode: {type: string, minLength: 1}
    ExperienceVersionReference:
      type: object
      additionalProperties: false
      required: [id, slug, detailVersion]
      properties:
        id: {type: string, pattern: '^exp-'}
        slug: {type: string, minLength: 1}
        detailVersion: {$ref: '#/components/schemas/OpaqueVersion'}
    ExperienceCatalogueManifest:
      type: object
      additionalProperties: false
      required: [catalogueVersion, generatedAt, experiences]
      properties:
        catalogueVersion: {$ref: '#/components/schemas/OpaqueVersion'}
        generatedAt: {type: string, format: date-time}
        experiences:
          type: array
          items: {$ref: '#/components/schemas/ExperienceVersionReference'}
    ExperienceCatalogueSummary:
      type: object
      additionalProperties: false
      required: [catalogueVersion, items]
      properties:
        catalogueVersion: {$ref: '#/components/schemas/OpaqueVersion'}
        items:
          type: array
          items: {$ref: '#/components/schemas/ExperienceCardSummary'}
    ExperienceList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Experience'}
    DateRange:
      type: object
      additionalProperties: false
      required: [startsOn, endsOn]
      properties:
        startsOn: {type: string, format: date}
        endsOn: {type: string, format: date}
    EnrolmentWindow:
      type: object
      additionalProperties: false
      required: [state, opensOn, closesOn, capacity]
      properties:
        state: {type: string, enum: [open, closed]}
        opensOn: {type: string, format: date}
        closesOn: {type: string, format: date}
        capacity: {type: integer, minimum: 1}
    Batch:
      type: object
      additionalProperties: false
      required: [id, experienceId, name, timezone, batchPeriod, enrolment, status]
      properties:
        id: {type: string, pattern: '^batch-'}
        experienceId: {type: string, pattern: '^exp-'}
        name: {type: string, minLength: 1}
        timezone: {type: string, minLength: 1}
        batchPeriod: {$ref: '#/components/schemas/DateRange'}
        enrolment: {$ref: '#/components/schemas/EnrolmentWindow'}
        status: {type: string, enum: [scheduled, active, completed, cancelled]}
    BatchList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Batch'}
    OtpRequest:
      type: object
      additionalProperties: false
      required: [mobile]
      properties:
        countryCode: {type: string, const: '+91', default: '+91'}
        mobile: {type: string, pattern: '^[6-9][0-9]{9}$'}
    OtpChallenge:
      type: object
      additionalProperties: false
      required: [challengeId, expiresInSeconds, prototypeOtp]
      properties:
        challengeId: {type: string, minLength: 1}
        expiresInSeconds: {type: integer, minimum: 1}
        prototypeOtp: {type: string, pattern: '^[0-9]{6}$'}
    OtpVerification:
      type: object
      additionalProperties: false
      required: [challengeId, otp]
      properties:
        challengeId: {type: string, minLength: 1}
        otp: {type: string, pattern: '^[0-9]{6}$'}
    Username:
      type: string
      minLength: 3
      maxLength: 32
      pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$'
      description: Account login identifier normalized to lowercase by the server.
    Password:
      type: string
      minLength: 15
      maxLength: 128
      writeOnly: true
      description: >-
        User-chosen password. The server applies compromised-password screening
        and password-specific hashing without imposing composition rules.
    PasswordAccountCreate:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: {$ref: '#/components/schemas/Username'}
        password: {$ref: '#/components/schemas/Password'}
    PasswordLogin:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: {$ref: '#/components/schemas/Username'}
        password: {$ref: '#/components/schemas/Password'}
    PersonalDetails:
      type: object
      additionalProperties: false
      required: [fullName, displayName, email, mobile, dateOfBirth, preferredLanguage, city, country, timezone, profilePicture]
      properties:
        fullName: {type: string}
        displayName: {type: string}
        email: {type: string}
        mobile: {type: string, pattern: '^(|\+91[6-9][0-9]{9})$'}
        dateOfBirth: {type: string}
        preferredLanguage: {type: string}
        city: {type: string}
        country: {type: string}
        timezone: {type: string}
        profilePicture: {type: string}
    OnboardingState:
      type: object
      additionalProperties: false
      required: [state, completedAt]
      properties:
        state: {type: string, enum: [pending, complete]}
        completedAt:
          anyOf:
            - {type: string, format: date-time}
            - {type: 'null'}
    User:
      type: object
      additionalProperties: false
      required: [id, roles, status, personalDetails, onboarding, createdAt]
      properties:
        id: {type: string, pattern: '^user-'}
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string}
        status: {type: string, enum: [active]}
        personalDetails: {$ref: '#/components/schemas/PersonalDetails'}
        onboarding: {$ref: '#/components/schemas/OnboardingState'}
        createdAt: {type: string, format: date-time}
    MyGitaDataManifest:
      type: object
      additionalProperties: false
      required:
        - accountId
        - accountVersion
        - profileVersion
        - journeyVersion
        - interestVersion
        - activityStateVersion
        - generatedAt
      properties:
        accountId: {type: string, pattern: '^user-'}
        accountVersion: {$ref: '#/components/schemas/OpaqueVersion'}
        profileVersion: {$ref: '#/components/schemas/OpaqueVersion'}
        journeyVersion: {$ref: '#/components/schemas/OpaqueVersion'}
        interestVersion: {$ref: '#/components/schemas/OpaqueVersion'}
        activityStateVersion: {$ref: '#/components/schemas/OpaqueVersion'}
        generatedAt: {type: string, format: date-time}
    AuthSession:
      type: object
      additionalProperties: false
      required: [accessToken, tokenType, expiresIn, isNewUser, user]
      properties:
        accessToken: {type: string, minLength: 1}
        tokenType: {type: string, const: Bearer}
        expiresIn: {type: integer, minimum: 1}
        isNewUser: {type: boolean}
        user: {$ref: '#/components/schemas/User'}
    ProfileUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        fullName: {type: string}
        displayName: {type: string}
        dateOfBirth: {type: string, format: date}
        email: {type: string}
        preferredLanguage: {type: string}
        city: {type: string}
    OnboardingUpdate:
      allOf:
        - $ref: '#/components/schemas/ProfileUpdate'
        - type: object
          required: [fullName, displayName, dateOfBirth]
    ActivityDelivery:
      type: object
      additionalProperties: false
      required: [mode, providerType]
      properties:
        mode: {type: string}
        providerType: {type: string}
    Activity:
      type: object
      required: [id, experienceId, title, activityType, guidanceMode, required, recommendedDurationMinutes, description, preparation, intendedOutcome, delivery]
      properties:
        id: {type: string, pattern: '^activity-'}
        experienceId: {type: string, pattern: '^exp-'}
        title: {type: string, minLength: 1}
        activityType: {type: string, minLength: 1}
        guidanceMode: {type: string, minLength: 1}
        required: {type: boolean}
        recommendedDurationMinutes: {type: integer, minimum: 1}
        description: {type: string, minLength: 1}
        preparation: {type: string, minLength: 1}
        intendedOutcome: {type: string, minLength: 1}
        delivery: {$ref: '#/components/schemas/ActivityDelivery'}
    Facilitator:
      type: object
      additionalProperties: false
      required: [userId, role, displayName]
      properties:
        userId: {type: string}
        role: {type: string}
        displayName: {type: string}
    Session:
      type: object
      additionalProperties: false
      required: [id, batchId, experienceActivityId, title, facilitators, startsAt, endsAt, status, delivery]
      properties:
        id: {type: string}
        batchId: {type: string}
        experienceActivityId: {type: string}
        title: {type: string}
        facilitators:
          type: array
          items: {$ref: '#/components/schemas/Facilitator'}
        startsAt: {type: string, format: date-time}
        endsAt: {type: string, format: date-time}
        status: {type: string}
        delivery: {$ref: '#/components/schemas/ActivityDelivery'}
    LearnerActivity:
      type: object
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/Activity'
        - type: object
          required: [completed, session]
          properties:
            completed: {type: boolean}
            session:
              anyOf:
                - $ref: '#/components/schemas/Session'
                - {type: 'null'}
    Progress:
      type: object
      additionalProperties: false
      required: [completed, total]
      properties:
        completed: {type: integer, minimum: 0}
        total: {type: integer, minimum: 0}
    Journey:
      type: object
      additionalProperties: false
      required: [id, userId, experienceId, batchId, status, startedOn, lastAccessed, currentContext, activityIds, completedActivityIds, experience, nextActivity, progress]
      properties:
        id: {type: string, pattern: '^journey-'}
        userId: {type: string, pattern: '^user-'}
        experienceId: {type: string, pattern: '^exp-'}
        batchId:
          anyOf:
            - {type: string, pattern: '^batch-'}
            - {type: 'null'}
        status: {type: string, enum: [active, completed]}
        startedOn: {type: string, format: date}
        lastAccessed: {type: string, format: date-time}
        currentContext: {type: string}
        activityIds:
